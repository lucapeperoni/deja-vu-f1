version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: race_user
      POSTGRES_PASSWORD: race_pass
      POSTGRES_DB: race_dynamics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres

volumes:
  postgres_data:
